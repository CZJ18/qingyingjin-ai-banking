name: Qingyingjin Adaptive Savings Agent
status: reference_requires_native_configuration_and_publishing
platform: Coze Studio native Agent
system_prompt_file: system-prompt.md
model: choose_actual_installed_model
plugins:
  openapi_file: services/banking-service/api/coze-plugin.openapi.yaml
  server_url: http://banking-service:8090
  auth:
    type: service_api_token
    location: header
    name: X-Banking-Tool-Key
    value: configure_in_native_plugin_secret_settings
    identity: operator_bound_Banking_user_only
  allowed_tools:
    - get_financial_plan
    - replan_financial_plan
    - compare_financial_plans
financial_execution_enabled: false
amount_computation: deterministic_Go_integer_cents_only
plan_selection_tool: none
user_confirmation_tool: none
collaboration:
  supervisor: configure_native_agent_or_published_tool_wrapper
  billing_and_subscription: reference_same_authorized_user_snapshot_sources
  preserve: [plan_id, version, data_digest, audit_id, trace_id, task_id]
  response_schema: services/banking-service/api/coze-plugin.openapi.yaml#/components/schemas/FinancialPlanView
workflows:
  generator: generate_tool_canvas.py
  verified_source_example: backend/domain/workflow/internal/canvas/examples/code_plugin.json
  verified_adapter: backend/domain/workflow/internal/nodes/plugin/plugin.go
  node_types: ['1', '4', '2']
  nodes: [Start_plan_and_correlation_ids, Plugin_planning_tool, End_structured_view]
  retry_times: 0
  require: [actual_plugin_id, actual_api_id, actual_plugin_name, actual_plugin_version]
  publish: configure_and_publish_in_native_Coze_Studio

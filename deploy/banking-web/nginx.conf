worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 1m;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Never log query strings, bodies, Authorization, nonce or signing material.
    log_format safe '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';
    access_log /dev/stdout safe;

    # Docker DNS permits the static app to start while upstreams are offline;
    # failures stay HTTP errors and never become the SPA document.
    resolver 127.0.0.11 valid=30s ipv6=off;
    map $request_uri $product_request_uri {
        ~^/product(?<product_path>/.*)$ $product_path;
        default '';
    }

    # Hashed build assets may be cached; HTML and all API responses may not.
    map "$uri:$status" $browser_cache_control {
        ~^/assets/.*:200$ 'public, max-age=31536000, immutable';
        default 'no-store';
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        set $banking_upstream banking-service:8090;
        set $agent_upstream banking-agent-service:8091;

        add_header Cache-Control $browser_cache_control always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
        # ECharts and Vue use inline style attributes. Scripts and network calls
        # remain same-origin; unsafe-inline is limited to styles, never scripts.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection '';
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header Last-Event-ID $http_last_event_id;
        proxy_connect_timeout 5s;
        proxy_send_timeout 210s;
        proxy_read_timeout 210s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_next_upstream off;
        proxy_intercept_errors off;

        location = /web-healthz {
            default_type text/plain;
            return 200 'ok\n';
        }

        location = /healthz { proxy_pass http://$banking_upstream$request_uri; }
        location = /readyz { proxy_pass http://$banking_upstream$request_uri; }
        location = /openapi.yaml { proxy_pass http://$banking_upstream$request_uri; }

        location ^~ /api/v1/ { proxy_pass http://$banking_upstream$request_uri; }
        location ^~ /api/v2/ { proxy_pass http://$banking_upstream$request_uri; }
        location = /api { return 404; }
        location ^~ /api/ { return 404; }

        location ^~ /product/api/v1/ { proxy_pass http://$agent_upstream$product_request_uri; }
        location = /product/openapi.json { proxy_pass http://$agent_upstream$product_request_uri; }
        location = /product/healthz { proxy_pass http://$agent_upstream$product_request_uri; }
        location = /product/readyz { proxy_pass http://$agent_upstream$product_request_uri; }
        location = /product { return 404; }
        location ^~ /product/ { return 404; }

        location ~ /\. { return 404; }
        location /assets/ { try_files $uri =404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}

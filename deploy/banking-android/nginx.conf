worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    server_tokens off;
    access_log off;
    client_max_body_size 1m;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=30s ipv6=off;
    server {
        listen 8080;
        set $web banking-web:8080;
        location = /downloads/qingrongjin.apk {
            alias /opt/apk/qingrongjin-1.0.1-demo.apk;
            default_type application/vnd.android.package-archive;
            add_header Content-Disposition 'attachment; filename="qingrongjin-1.0.1-demo.apk"';
            add_header Cache-Control no-store;
            add_header X-Content-Type-Options nosniff;
        }
        location ^~ /downloads/ { return 404; }
        location / {
            proxy_pass http://$web$request_uri;
            proxy_http_version 1.1;
            # Preserve host:port and Origin for the existing exact-origin auth check.
            proxy_set_header Host $http_host;
            proxy_set_header Connection '';
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 210s;
            proxy_send_timeout 210s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_next_upstream off;
        }
    }
}

              schema:
                $ref: '#/components/schemas/Envelope'
        '404':
          description: NOT_FOUND (including unowned resource)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '409':
          description: IDEMPOTENCY_CONFLICT / VERSION_CONFLICT / STATE_CONFLICT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '422':
          description: APPROVAL_REQUIRED / RISK_REJECTED / ANALYSIS_LIMIT / MODEL_OUTPUT_INVALID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '503':

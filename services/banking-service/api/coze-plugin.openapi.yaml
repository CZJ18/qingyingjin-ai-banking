      name: X-Trace-ID
      in: header
      required: false
      description: Correlation only; never proof of identity or authorization
      schema:
        type: string
        pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
    TaskID:
      name: X-Task-ID
      in: header
      required: false
      description: Correlation only; future task access requires owner validation
      schema:
        type: string
        pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[!-~]+$
      description: Scoped to user/action. Same key + canonical body returns persisted
        original result; different body returns 409.

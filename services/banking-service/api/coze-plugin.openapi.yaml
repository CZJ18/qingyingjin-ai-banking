openapi: 3.0.3
info:
  title: Qingyingjin Banking Agent Tools
  version: 0.11.0
  description: Operator-bound user. Financial evidence, advisory planning and gateway-checked
    cancellation proposals only. No transfer, financial approval, settings writes
    or plan selection.
servers:
- url: http://banking-service:8090
paths:
  /tools/v1/integration/context:
    get:
      operationId: banking_integration_context
      summary: Verify trusted Banking user mapping and correlation IDs
      description: Does not read financial data or execute financial operations.
      security:
      - BankingToolKey: []
      parameters:
      - name: X-Trace-ID
        in: header
        schema:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
      - name: X-Task-ID
        in: header
        schema:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
      responses:
        '200':
          description: Integration context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationProbeEnvelope'
        '400':
          description: INVALID_ARGUMENT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationProbeEnvelope'
        '401':
          description: UNAUTHENTICATED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationProbeEnvelope'
  /tools/v1/billing/get_transactions:
    post:
      operationId: get_transactions
      tags:
      - Billing
      security:
      - BankingToolKey: []
      parameters:
      - $ref: '#/components/parameters/TraceID'
      - $ref: '#/components/parameters/TaskID'
      description: Read-only financial analysis, amounts in integer CNY cents. External
        persisted transactions only, including record_only facts. Half-open period
        <=366 days; at most 10000 loaded records including baseline/full budget months.
        Pagination applies only to returned transactions, not totals. UTC full-month
        budgets include all user accounts. Anomalies require review, no confirmed
        loss or guaranteed savings; no health judgement. Reports/audits persist; no
        funds change.
      responses:
        '200':
          description: Persisted authoritative Go analysis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingReportResponse'
        '400':
          description: INVALID_ARGUMENT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '401':
          description: UNAUTHENTICATED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '403':
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '404':
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '422':
          description: ANALYSIS_LIMIT / INVALID_TRANSACTION_DATA / MODEL_OUTPUT_INVALID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '503':
          description: COZE_UNAVAILABLE / DEPENDENCY_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingInput'

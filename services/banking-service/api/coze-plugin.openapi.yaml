  /tools/v1/subscriptions/detect_subscriptions:
    post:
      operationId: detect_subscriptions
      tags:
      - Subscription
      security:
      - BankingToolKey: []
      parameters:
      - $ref: '#/components/parameters/TraceID'
      - $ref: '#/components/parameters/TaskID'
      description: Local simulated subscription only. Candidate evidence does not
        prove merchant contract or inactivity. Forecasts are integer CNY cents and
        never available balance or goal deposits. Cancellation proposal is gateway
        checked and version bound; execution requires separate user JWT confirmation.
        Forecast period uses currently linked evidence, not all bank expenses. Detection
        <=1096 days, <=10000 transactions; reports <=1000 subscriptions/10000 payments.
        A terminal failed/expired result is a business outcome, inspect status and
        failure_code.
      responses:
        '200':
          description: Successful result; inspect business status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionReportResponse'
        '400':
          description: INVALID_ARGUMENT

      type: object
      additionalProperties: false
      properties:
        account_id: *id078
        issuer: *id079
        name: *id080
        last_four: *id081
        card_type: *id082
        credit_limit_minor: *id083
        action:
          type: string
          enum:
          - bind
          - apply
          - unbind
          - set_default
          - adjust_limit
          - set_transaction_limit
          - lock
          - unlock
          - report_lost
        card_id:
          type: string
          format: uuid
        transaction_limit_minor:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000
      required:
      - action
      description: User-only simulated metadata. apply/bind require account, issuer, name, four digits,
        card type. Other actions require card_id; adjust_limit requires an explicit positive credit_limit_minor,
        set_transaction_limit requires transaction_limit_minor including zero. Missing/zero credit adjustments
        are rejected. Lost cards cannot be unlocked; locked cards may be reported lost directly. All writes
        require prepare/authorize/execute; no PAN/CVV or bank integration.

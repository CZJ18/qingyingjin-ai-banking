        '400':
          description: Invalid bounded input
        '401':
          description: Authentication required
        '403':
          description: User-only; agents refused
        '404':
          description: Owned resource not found
        '409':
          description: Version or idempotency conflict
        '503':
          description: Dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseTrialReviewInput'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: id
        in: path
        required: true
        schema: *id001
  /api/v2/lifestyle-goals/expense-reduction-preview:
    post:
      operationId: preview_expense_reduction
      tags:
      - Lifestyle
      security:
      - UserBearer: []
      description: User-only, read-only what-if advice for next Shanghai month from an owned stored report.
        Uses existing deterministic lifestyle rules, never a model call, persisted recommendation or financial
        authorization. Partial months remain needs_information. Forecast reductions are not available
        cash.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpensePreviewInput'
      responses:
        '200':
          description: Grounded scenario or explicit missing information; never guaranteed savings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpensePreviewResponse'
        '400':
          description: Invalid goal, period, category or body
        '401':
          description: User authentication required
        '403':
          description: Agents cannot use this user-only preview
        '404':
          description: Source report not owned or not found
        '503':
          description: Storage unavailable; no fallback data
  /api/v1/model-admission:
    get:
      operationId: getModelAdmissionSnapshot
      tags:
      - Orchestrator
      security:
      - UserBearer: []
      description: Read-only authenticated owner's fee snapshot. Never grants workflow scope, reserves
        funds, or authorizes financial execution. Simulation is explicitly labelled.
      responses:
        '200':
          description: Current approval limits and remaining monetary, request and concurrency snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '401':
          description: User authentication required
        '403':
          description: User outside approval scope (MODEL_APPROVAL_REQUIRED)
        '503':
          description: Missing monetary admission, execution confirmation or unavailable fee ledger (MODEL_MONETARY_ADMISSION_REQUIRED
            / MODEL_EXECUTION_CONFIRMATION_REQUIRED). When no admission provider is configured, data.reason
            is MODEL_ADMISSION_NOT_CONFIGURED; this diagnostic does not grant execution or imply exhausted funds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /healthz:
    get:
      operationId: getLiveness
      tags:
      - Foundation
      responses:
        '200':
          description: Process is alive, independent of dependencies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /readyz:
    get:
      operationId: getReadiness
      tags:
      - Foundation
      responses:
        '200':
          description: Configured financial database SELECT, schema version, active storage authority
            and Redis PING succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/context:
    get:
      operationId: getUserIntegrationContext
      tags:
      - Foundation
      security:
      - UserBearer: []
      parameters:
      - $ref: '#/components/parameters/TraceID'
      - $ref: '#/components/parameters/TaskID'
      responses:
        '200':
          description: Trusted user identity and correlation context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /tools/v1/integration/context:
    get:
      operationId: getToolIntegrationContext
      tags:
      - Foundation
      security:
      - ToolKey: []
      parameters:
      - $ref: '#/components/parameters/TraceID'
      - $ref: '#/components/parameters/TaskID'
      responses:
        '200':
          description: Server-bound tool identity; no financial permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /openapi.yaml:
    get:
      operationId: getOpenAPI
      responses:
        '200':
          description: OpenAPI 3.0.3 document
          content:
            application/yaml:
              schema:
                type: object
  /coze-plugin.openapi.yaml:
    get:
      operationId: getPluginOpenAPI
      responses:
        '200':
          description: Coze tool subset, excludes user credentials and future approvals
          content:
            application/yaml:
              schema:

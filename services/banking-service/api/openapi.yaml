      - action
      - product_id
      - account_id
      - amount_minor
      - assessment_id
    ExecutionOccasionPlanParameters:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 96
        birthday:
          type: string
          format: date
        order_time:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          default: 09:00
          description: Shanghai local HH:MM on the calendar day exactly two days before the birthday.
            The immutable plan snapshot binds this time; scheduling still requires separate consent.
        account_id: *id096
        reserve_minor:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000000
        items:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            type: string
            enum:
            - flowers
            - cake
      required:
      - name
      - birthday
      - account_id
      - reserve_minor
      - items
    ExecutionOccasionOrderParameters:
      type: object
      additionalProperties: false
      properties:
        plan_id:
          type: string
          format: uuid
        execute_at:
          type: integer
          format: int64
          minimum: 0
          description: Zero explicitly means immediate local simulated order. Nonzero must equal funded
            plan birthday-minus-two-days Shanghai due time (default09:00), within30 days.
      required:
      - plan_id
      - execute_at
    ExecutionOccasionReleaseParameters:
      type: object
      additionalProperties: false
      properties:
        plan_id:
          type: string
          format: uuid
        account_id: *id096
      required:
      - plan_id
      - account_id

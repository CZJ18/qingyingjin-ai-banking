  /api/v1/langgraph/background-delegations:
    post:
      operationId: langgraph_background_delegations
      tags:
      - Orchestrator
      description: Server-to-server only. Requires BOTH the authenticated user's Bearer JWT and X-Banking-Agent-Key.
        The persisted user must be active and the user session must remain valid. Specialist agent, tool
        and background actors cannot issue this grant. The caller supplies the canonical persisted task
        root and immutable request digest for that authenticated owner; user_id is never accepted as authority.
        The returned opaque capability is bound to this owner, task and digest for up to 24 hours, and
        can only request child specialist delegations through /api/v1/langgraph/delegations. It cannot
        call ordinary user APIs or authorize financial execution. Store as a secret; never expose in browser/model
        content or log request credentials, response capability, or the complete response body.
      security:
      - UserBearer: []
        AgentServiceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - task_id
              - request_digest
              properties:
                task_id:
                  type: string
                  pattern: ^lg-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                  description: Canonical task root without a specialist suffix.
                request_digest:
                  type: string
                  pattern: ^[0-9a-f]{64}$
                  description: SHA-256 digest of the persisted immutable task request.
      responses:
        '200':
          description: Opaque task-bound background grant; sensitive response, never log.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                      - capability
                      - task_id
                      - request_digest
                      - expires_in_seconds
                      properties:
                        capability:
                          type: string
                          pattern: ^bgt1\.[A-Za-z0-9_-]+$
                          format: password
                          x-sensitive: true
                          description: Sensitive opaque credential; returned only to the trusted task
                            service, never log or disclose to models/browser clients.
                        task_id:
                          type: string
                        request_digest:
                          type: string
                          pattern: ^[0-9a-f]{64}$
                        expires_in_seconds:
                          type: integer
                          enum:
                          - 86400
        '400':
          description: INVALID_ARGUMENT; canonical task root and lowercase SHA-256 required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '401':
          description: UNAUTHENTICATED; both user Bearer and service key required, or session revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '403':
          description: FORBIDDEN; active user actor required, agent actors cannot issue grants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '503':
          description: DEPENDENCY_UNAVAILABLE; bridge or authoritative account validation unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'

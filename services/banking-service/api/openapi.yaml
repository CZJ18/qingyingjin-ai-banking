  /api/v1/auth/register:
    post:
      operationId: registerPhoneSession
      tags:
      - Authentication
      description: Register an independent simulated user and sign in. Does not claim historical users,
        open accounts or credit funds. JSON only, no-store. Auth cookies are never accepted as business
        API authorization.
      security: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneRegistration'
      responses:
        '201':
          description: Authenticated browser session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserSessionResponse'
          headers:
            Set-Cookie:
              description: Host-only qingrongjin_refresh; Path=/api/v1/auth; HttpOnly; SameSite=Strict;
                Secure by default. Removed on logout. Never appears in JSON.
              schema:
                type: string
        '400':
          description: 'INVALID_ARGUMENT: invalid phone, password or JSON'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '401':
          description: 'UNAUTHENTICATED or AUTH_INVALID_CREDENTIALS: fixed generic failure; no account
            existence disclosure'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '403':
          description: 'FORBIDDEN: invalid Origin or caller'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '409':
          description: 'AUTH_PHONE_UNAVAILABLE or STATE_CONFLICT: phone or identity already bound'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '429':
          description: 'AUTH_RATE_LIMITED: Redis atomic phone/IP limit'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
          headers:
            Retry-After:
              schema:
                type: string
        '503':
          description: 'DEPENDENCY_UNAVAILABLE or STORAGE_FROZEN: authentication fails closed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '500':
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'

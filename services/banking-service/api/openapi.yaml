        '422':
          description: INSUFFICIENT_FUNDS / ACCOUNT_FROZEN / ACCOUNT_CLOSED / APPROVAL_REQUIRED / APPROVAL_EXPIRED
            / RISK_REJECTED / AMOUNT_LIMIT
          content:
            application/json:
              schema:

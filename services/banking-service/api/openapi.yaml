      - name
      - risk_level
      - minimum_minor
      - lock_days
      - description
      - is_simulated
    ScenarioState:
      type: object
      additionalProperties: false
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/InvestmentProduct'
        positions:

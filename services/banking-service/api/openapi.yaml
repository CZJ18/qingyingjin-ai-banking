components:
  securitySchemes:
    UserBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ToolKey:
      type: apiKey
      in: header
      name: X-Banking-Tool-Key
    BankingToolKey:
      type: apiKey
      in: header
      name: X-Banking-Tool-Key
    AgentServiceKey:
      type: apiKey
      in: header
      name: X-Banking-Agent-Key
      description: Independent server-only delegation credential; never sent to a model or browser.
  parameters:
    TraceID:
      name: X-Trace-ID
      in: header
      required: false
      description: Correlation only; never proof of identity or authorization
      schema:
        type: string
        pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
    TaskID:
      name: X-Task-ID
      in: header
      required: false
      description: Correlation only; future task access requires owner validation
      schema:
        type: string
        pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[!-~]+$
      description: Scoped to user/action. Same key + canonical body returns persisted original result;
        different body returns 409.
  schemas:
    ExpenseTrialInput:
      type: object
      additionalProperties: false
      properties:
        statement_check:
          $ref: '#/components/schemas/ExpenseStatementCheck'
        expected_reduction_minor:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000000
        account_id: &id017
          type: string
          pattern: ^[1-9][0-9]*$
        billing_report_id:
          type: string
          maxLength: 64
        target_period:
          type: string
        target_minor:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000000
        category: &id018
          type: string
          enum:
          - shopping
          - subscriptions
          - sports
          - other
      required:
      - account_id
      - billing_report_id
      - target_period
      - target_minor
      - category
    ExpenseTrial:
      type: object
      additionalProperties: false
      properties:
        id: *id017
        user_id: *id017
        account_id: *id017
        billing_report_id:
          type: string
        baseline_digest:
          type: string
        target_period:
          type: string
        target_minor: &id019
          type: integer
          format: int64
        category: *id018
        started_at: *id019
        ends_at: *id019
        status:
          type: string
          enum:
          - active
          - completed
        version: *id019
        created_at: *id019
        updated_at: *id019
      required:
      - id
      - user_id
      - account_id
      - billing_report_id
      - baseline_digest
      - target_period
      - target_minor
      - category
      - started_at
      - ends_at
      - status
      - version
      - created_at
      - updated_at
    ExpenseTrialProgress:
      type: object
      additionalProperties: false
      properties:
        from: *id019
        to: *id019
        total_expense_minor: *id019
        category_expense_minor: *id019
        evidence_transaction_ids:
          type: array
          items: *id017
        window_complete:
          type: boolean
        confirmed_savings_minor:
          type: integer
          format: int64
          nullable: true
          description: Always null. Recorded spending is not independently verified savings.
      required:
      - from
      - to
      - total_expense_minor
      - category_expense_minor
      - evidence_transaction_ids
      - window_complete
      - confirmed_savings_minor
    ExpenseTrialReviewInput:
      type: object
      additionalProperties: false
      properties:
        expected_version:
          type: integer
          format: int64
          minimum: 1
        note:
          type: string
          maxLength: 2000
          description: At most 2000 UTF-8 bytes; personal observation, never a financial amount claim.
      required:
      - expected_version
      - note
    ExpenseTrialReview:
      type: object
      additionalProperties: false
      properties:
        observed_at: *id019
        note:
          type: string
        progress:
          $ref: '#/components/schemas/ExpenseTrialProgress'
      required:
      - observed_at
      - note
      - progress
    ExpenseTrialBaseline:
      type: object
      additionalProperties: false
      properties:
        category:
          type: string
        expense_minor: *id019
        transaction_ids:
          type: array
          items: *id017
      required:
      - category
      - expense_minor
      - transaction_ids
    ExpenseTrialView:
      type: object
      additionalProperties: false
      properties:
        plan:
          $ref: '#/components/schemas/ExpenseTrialPlan'
        comparison:
          $ref: '#/components/schemas/ExpenseTrialComparison'
        trial:
          $ref: '#/components/schemas/ExpenseTrial'
        baseline:
          $ref: '#/components/schemas/ExpenseTrialBaseline'
        baseline_period:
          type: object
          additionalProperties: false
          required:
          - from
          - to
          - timezone
          properties:
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time
            timezone:
              type: string
        baseline_complete:
          type: boolean
        progress:
          $ref: '#/components/schemas/ExpenseTrialProgress'
        review:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/ExpenseTrialReview'
        financial_execution_enabled:
          type: boolean
          enum:
          - false
      required:
      - trial
      - baseline
      - baseline_period
      - baseline_complete
      - progress
      - review
      - financial_execution_enabled
    ExpenseTrialResponse:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        trace_id:
          type: string
        data:
          $ref: '#/components/schemas/ExpenseTrialView'
      required:
      - code
      - message
      - request_id
      - trace_id
      - data
    ExpenseTrialListResponse:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        trace_id:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseTrialView'
      required:
      - code
      - message
      - request_id
      - trace_id
      - data
    ExpenseStatementCheck:
      type: object
      additionalProperties: false
      description: User-entered full-month statement totals checked against one owned report. Not bank authenticity, verified coverage, savings, funds or authorization.
      required: [full_month_confirmed, transaction_count, income_minor, expense_minor]
      properties:
        full_month_confirmed:
          type: boolean
          enum: [true]
        transaction_count:
          type: integer
          format: int64
          minimum: 0
          maximum: 10000
        income_minor:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000
        expense_minor:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000
    ExpenseTrialPlan:
      type: object
      additionalProperties: false
      required: [expected_reduction_minor, monthly_limit_minor, statement_check]
      properties:
        expected_reduction_minor:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000000
        monthly_limit_minor:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000
        statement_check:
          $ref: '#/components/schemas/ExpenseStatementCheck'
    ExpenseTrialComparison:
      type: object
      additionalProperties: false
      description: Two equal seven-day windows, snapshot membership and source totals checked. Recorded differences are reference only and never confirmed savings.
      required: [status, baseline_period, category_expense_minor, total_expense_minor, category_difference_minor, total_difference_minor]
      properties:
        status:
          type: string
          enum: [recorded_reference_only, source_changed]
        baseline_period:
          type: object
          required: [from, to, timezone]
          properties:
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time
            timezone:
              type: string
        category_expense_minor:
          type: integer
          format: int64
        total_expense_minor:
          type: integer
          format: int64
        category_difference_minor:
          type: integer
          format: int64
          nullable: true
        total_difference_minor:
          type: integer
          format: int64
          nullable: true
    ExpensePreviewInput:
      type: object
      additionalProperties: false
      required:
      - billing_report_id
      - target_period
      - target_minor
      - adjustable_categories
      properties:
        statement_check:
          $ref: '#/components/schemas/ExpenseStatementCheck'
        billing_report_id:
          type: string
          minLength: 1
          maxLength: 64
        target_period:
          type: string
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
          description: Next Asia/Shanghai calendar month only
        target_minor:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000000
        adjustable_categories:
          type: array
          maxItems: 32
          uniqueItems: true
          items:
            type: string
    ExpensePreview:
      type: object
      additionalProperties: false
      required:
      - source
      - billing_report_id
      - baseline_period
      - target_period
      - target_minor
      - historical_expense_minor
      - evidence_transaction_ids
      - result
      properties:
        baseline_status:
          type: string
          enum: [unverified, user_reconciled]
          description: Matching user-declared totals only; not bank-verified completeness.
        statement_check:
          $ref: '#/components/schemas/ExpenseStatementCheck'
        source:
          type: string
          enum:
          - deterministic_lifestyle_rules
        billing_report_id:
          type: string
        baseline_period:
          type: object
          additionalProperties: false
          required:
          - from
          - to
          - timezone
          properties:
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time
            timezone:
              type: string
        target_period:
          type: string
        target_minor:
          type: integer
          format: int64
        historical_expense_minor:
          type: integer
          format: int64
        evidence_transaction_ids:
          type: array
          items:
            type: string
        result:
          $ref: '#/components/schemas/LifestyleResult'
    ExpensePreviewResponse:
      type: object
      required:
      - code
      - message
      - request_id
      - trace_id
      - data
      properties:
        code:
          type: string
          enum:
          - OK
        message:
          type: string
        request_id:
          type: string
        trace_id:
          type: string
        data:
          $ref: '#/components/schemas/ExpensePreview'
    StatementSource:
      type: object
      additionalProperties: false
      required:
      - kind
      - file_sha256
      - row_sha256
      - row_number
      - raw_record
      - columns
      - timezone
      properties:
        kind:
          type: string
          enum:
          - unverified_csv_upload
        timezone:
          type: string
          enum:
          - UTC
          - Asia/Shanghai
        columns:
          type: object
          minProperties: 1
          maxProperties: 9
          additionalProperties:
            type: string
        file_sha256:

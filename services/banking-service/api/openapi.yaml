          type: integer
          format: int64
          minimum: 0
        updated_at: *id077
        transaction_limit_minor:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000
          description: Optional legacy field. Zero explicitly blocks card-initiated transfers; absence
            retains account risk policy. Not a cash balance.

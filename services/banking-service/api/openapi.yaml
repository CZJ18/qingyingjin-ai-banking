              schema:
                $ref: '#/components/schemas/Envelope'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /openapi.yaml:
    get:
      operationId: getOpenAPI
      responses:
        '200':
          description: OpenAPI 3.0.3 document
          content:
            application/yaml:
              schema:
                type: object
  /coze-plugin.openapi.yaml:
    get:
      operationId: getPluginOpenAPI
      responses:
        '200':
          description: Coze tool subset, excludes user credentials and future approvals
          content:

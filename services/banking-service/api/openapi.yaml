openapi: 3.0.3
info:
  title: Qingyingjin Banking and Adaptive Savings API
  version: 0.25.0
  description: Simulated CNY accounts only. Amounts are integer minor units; IDs are decimal strings;
    timestamps are Unix milliseconds. User JWT is mandatory for Core. Financial changes require explicit
    user confirmation and a balanced persisted ledger. Module8 may replace the simulation safety gateway.
    No Agent financial execution endpoints. Module3 Goal compiler uses a configured Coze workflow and
    JSON Schema validation; no financial execution. Monthly income is never inferred from account balance.
    The configured financial database is MySQL or PostgreSQL. Storage authority is controlled by an operator-only
    migration command, never by an Agent or REST API. Frozen or standby stores reject business writes
    with HTTP 503 and code STORAGE_FROZEN; clients must not switch databases automatically.
servers:
- url: http://localhost:8090
tags:
- name: Foundation
- name: Users
- name: Accounts
- name: Transactions
- name: Transfers
- name: Budgets
- name: Savings
- name: Audits
- name: GoalCompiler
- name: Billing
- name: Subscription
- name: AdaptiveSavings
- name: Orchestrator
- name: Execution
- name: Authentication
paths:
  /api/v2/expense-trials:
    post:
      operationId: start_expense_trial
      tags:
      - Lifestyle
      summary: start expense trial
      description: User-only persistent advisory trial. Existing ownership, idempotency, audit and storage
        fencing apply. No model or financial execution. Recorded expenses and personal observations do
        not establish savings.
      security:
      - UserBearer: []
      responses:
        '201':
          description: Advisory record only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseTrialResponse'
        '400':
          description: Invalid bounded input
        '401':
          description: Authentication required
        '403':
          description: User-only; agents refused
        '404':
          description: Owned resource not found
        '409':
          description: Version or idempotency conflict
        '503':
          description: Dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseTrialInput'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
    get:
      operationId: list_expense_trials
      tags:
      - Lifestyle
      summary: list expense trials
      description: User-only persistent advisory trial. Existing ownership, idempotency, audit and storage
        fencing apply. No model or financial execution. Recorded expenses and personal observations do
        not establish savings.
      security:
      - UserBearer: []
      responses:
        '200':
          description: Advisory record only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseTrialListResponse'
        '400':
          description: Invalid bounded input
        '401':
          description: Authentication required
        '403':
          description: User-only; agents refused
        '404':
          description: Owned resource not found
        '409':
          description: Version or idempotency conflict
        '503':
          description: Dependency unavailable
      parameters:
      - name: account_id
        in: query
        required: true
        schema: &id001
          type: string
          pattern: ^[1-9][0-9]*$
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 1000000
          default: 0
  /api/v2/expense-trials/{id}:
    get:
      operationId: get_expense_trial
      tags:
      - Lifestyle
      summary: get expense trial
      description: User-only persistent advisory trial. Existing ownership, idempotency, audit and storage
        fencing apply. No model or financial execution. Recorded expenses and personal observations do
        not establish savings.
      security:
      - UserBearer: []
      responses:
        '200':
          description: Advisory record only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseTrialResponse'
        '400':
          description: Invalid bounded input
        '401':
          description: Authentication required
        '403':
          description: User-only; agents refused
        '404':
          description: Owned resource not found
        '409':
          description: Version or idempotency conflict
        '503':
          description: Dependency unavailable
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
  /api/v2/expense-trials/{id}/reviews:
    post:
      operationId: review_expense_trial
      tags:
      - Lifestyle
      summary: review expense trial
      description: User-only persistent advisory trial. Existing ownership, idempotency, audit and storage

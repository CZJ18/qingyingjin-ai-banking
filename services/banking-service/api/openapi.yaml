      - operations
      - is_simulated
    ScenarioResponse:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/ScenarioState'
        required:
        - data
    ScenarioOverviewInput:
      type: object
      additionalProperties: false
      properties:
        scenario:
          type: string
          enum: &id098
          - transfer
          - cards
          - investment
          - subscriptions
          - birthday
        account_id: &id099
          type: string
          pattern: ^[1-9][0-9]*$
          maxLength: 19
      required:
      - scenario
      - account_id
    ScenarioOverviewItem:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        kind:
          type: string
          enum:
          - source_account
          - saved_recipient_reference
          - card
          - investment_product
          - subscription
          - registered_birthday
        status:
          type: string
          enum:
          - active
          - frozen
          - inactive
          - closed
          - requires_explicit_selection
          - unbound
          - locked
          - lost
          - catalog_only
          - candidate
          - cancelled
          - recorded
          - disabled
        label:
          type: string
          maxLength: 128
          description: System-owned simulated product name only; never customer names or merchant text.
        currency:
          type: string
          enum:
          - CNY
        amount_minor:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000
        credit_limit_minor:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000
        credit_available_minor:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000
        transaction_limit_minor:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000
        minimum_minor:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000
        version:
          type: integer
          format: int64
          minimum: 1
        risk_level:
          type: integer
          minimum: 1
          maximum: 3
        lock_days:
          type: integer
          minimum: 0
          maximum: 3660
        billing_interval:
          type: string
          enum:
          - weekly
          - monthly
          - quarterly
          - annual
        next_billing_at:
          type: integer
          format: int64
          minimum: 0
          description: Exact existing Unix milliseconds; not an execution schedule.
        month_day:
          type: string
          pattern: ^[0-9]{2}-[0-9]{2}$
        next_date:
          type: string
          format: date
        days_until:
          type: integer
          minimum: 0
          maximum: 3660
      required:
      - id
      - kind
      - status
    ScenarioOverview:
      type: object
      additionalProperties: false
      description: Server-owned limited read-only facts. No financial intent, grant, fee reservation,
        supplier request or execution is created. Saved recipient IDs are unverified references requiring
        explicit human selection; birthday dates come only from the user calendar.
      properties:
        scenario:
          type: string
          enum: *id098
        account_id: *id099
        user_id: *id099
        is_simulated:
          type: boolean
          enum:
          - true
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ScenarioOverviewItem'
        limitations:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: string
            minLength: 1
            maxLength: 2048
        truncated:
          type: boolean
      required:
      - scenario
      - account_id
      - user_id
      - is_simulated
      - items
      - limitations
      - truncated
    ScenarioOverviewResponse:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/ScenarioOverview'
        required:
        - data
  responses:
    StatementError:
      description: Invalid upload, unauthenticated or unowned resource, conflict or dependency failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    InvalidArgument:
      description: INVALID_ARGUMENT
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    Unauthenticated:
      description: UNAUTHENTICATED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    DependencyUnavailable:
      description: DEPENDENCY_UNAVAILABLE or STORAGE_FROZEN (maintenance authority is not active; no automatic
        database fallback)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'

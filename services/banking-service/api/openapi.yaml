components:
  securitySchemes:
    UserBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ToolKey:
      type: apiKey
      in: header
      name: X-Banking-Tool-Key
    BankingToolKey:
      type: apiKey
      in: header
      name: X-Banking-Tool-Key
    AgentServiceKey:
      type: apiKey
      in: header
      name: X-Banking-Agent-Key
      description: Independent server-only delegation credential; never sent to a model or browser.
  parameters:
    TraceID:
      name: X-Trace-ID
      in: header
      required: false
      description: Correlation only; never proof of identity or authorization
      schema:
        type: string
        pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
    TaskID:
      name: X-Task-ID
      in: header
      required: false
      description: Correlation only; future task access requires owner validation
      schema:
        type: string
        pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[!-~]+$
      description: Scoped to user/action. Same key + canonical body returns persisted original result;
        different body returns 409.
  schemas:
    Actor:
      type: object
      required:
      - kind
      - subject
      - user_id
      - scopes
      properties:
        kind:
          type: string
          enum:
          - user
          - agent
          - tool
        subject:
          type: string
        user_id:
          type: string
          pattern: ^[1-9][0-9]*$
        coze_user_id:
          type: string
          pattern: ^[1-9][0-9]*$
        scopes:
          type: array
          items:
            type: string
        token_id: &id016
          type: string
        agent_type: *id016
        task_id: *id016
    Envelope:
      type: object
      required:
      - code
      - message
      - request_id
      - trace_id
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
          format: uuid
        trace_id:
          type: string
        task_id:
          type: string
        data: {}
    User:
      type: object
      properties:
        id: *id004
        display_name: *id005
        status: *id005
        created_at: &id017
          type: integer
          format: int64
        updated_at: *id017
      required:
      - id
      - display_name
      - status
      - created_at
      - updated_at
    BankAccount:
      type: object
      properties:
        id: *id004
        user_id: *id004
        created_at: *id017
        updated_at: *id017
        display_name: *id005
        account_type:
          type: string
          enum:
          - checking
          - savings
        masked_account_number: *id005
        currency: &id018
          type: string
          enum:
          - CNY
          default: CNY
        balance_minor: &id019
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000
          description: Integer CNY cents (never float)
        status: &id025
          type: string
          enum:
          - active
          - frozen
          - inactive
          - closed
        version: *id017
        is_simulated: &id020
          type: boolean
        savings_goal_id: *id004
      required:
      - id
      - user_id
      - created_at
      - updated_at
      - display_name
      - account_type
      - masked_account_number
      - currency
      - balance_minor
      - status
      - version
      - is_simulated
    AccountBalance:
      type: object
      properties:
        account_id: *id004
        currency: *id018
        balance_minor: *id019
        ledger_balance_minor: *id017
        version: *id017
        reconciled: *id020
      required:
      - account_id
      - currency
      - balance_minor
      - ledger_balance_minor
      - version
      - reconciled
    Transaction:
      type: object
      properties:
        id: *id004
        user_id: *id004
        created_at: *id017
        updated_at: *id017
        bank_account_id: *id004
        direction: *id021
        amount_minor: &id022
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000000
          description: Integer CNY cents (never float)
        currency: *id018
        category: *id005
        merchant_name: *id005
        description: *id005
        occurred_at: &id023
          type: integer
          format: int64
          minimum: 1
          description: Unix milliseconds UTC
        kind:
          type: string
          enum:
          - opening
          - external
          - internal_transfer
        effect_mode: &id026
          type: string
          enum:
          - record_only
          - apply_simulated_effect
        trace_id: *id005
        audit_id: *id005
        external_transaction_id: *id005
        journal_id: *id005
        transfer_id: *id004
        task_id: *id005
      required:
      - id
      - user_id
      - created_at
      - updated_at
      - bank_account_id
      - direction
      - amount_minor
      - currency
      - category
      - merchant_name
      - description
      - occurred_at
      - kind
      - effect_mode
      - trace_id
      - audit_id
    TransactionPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        total: *id017

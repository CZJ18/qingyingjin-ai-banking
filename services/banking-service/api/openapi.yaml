    ExecutionScheduledTransferParameters:
      type: object
      additionalProperties: false
      properties:
        source_account_id: &id096
          type: string
          pattern: ^[1-9][0-9]*$
        target_account_id: *id096
        amount_minor:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000000
        execute_at:
          type: integer
          format: int64
          description: Exact future Unix milliseconds within30 days; execution authorization expires15
            minutes after this time. No funds post before due.
        description:
          type: string
          maxLength: 128
      required:
      - source_account_id
      - target_account_id
      - amount_minor
      - execute_at
      - description
    ExecutionInvestmentAssessmentParameters:
      type: object
      additionalProperties: false
      properties:
        answers:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: integer
            minimum: 1
            maximum: 3
      required:
      - answers
    ExecutionInvestmentOrderParameters:
      type: object
      additionalProperties: false
      properties:
        action:
          type: string
          enum:
          - buy
          - redeem
        product_id:
          type: string
          enum:
          - sim-cash-v1
          - sim-bond-v1
          - sim-equity-v1
        account_id: *id096
        amount_minor:
          type: integer
          format: int64
          minimum: 1

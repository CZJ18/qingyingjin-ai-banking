          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      description: Registers only the validated JWT subject. Replay preserves the existing profile; cannot
        supply user_id.
    get:
      operationId: getUser
      tags:
      - Users
      security:

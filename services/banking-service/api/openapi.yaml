          description: Required positive simulated account for simulation; omit or use 0 for wechat_manual.
        already_paid:
          type: boolean
          enum:
          - true
        owner_share_minor: *id081
        participants:
          type: array
          minItems: 1
          maxItems: 19
          items:
            $ref: '#/components/schemas/AAShareInput'
        payment_method: &id083
          type: string
          enum:
          - simulation
          - wechat_manual
          description: Immutable channel; omitted means simulation. WeChat manual records never write
            financial balances.
        recipient_hint: &id084
          type: string
          maxLength: 128
          description: Owner supplied hint, not verified WeChat identity.
        memo: &id085
          type: string
          maxLength: 400
        items: &id086
          type: array
          maxItems: 30
          items:
            $ref: '#/components/schemas/AALineItem'
          description: Required for wechat_manual; positive amounts must sum exactly to total_minor.
        management_mode:
          type: string
          enum:
          - single_manager
          - collaborative
          description: New wechat_manual defaults single_manager. Historical stored omission means collaborative.
            Single manager has no invitations or payer self-report. Immutable.
      required:
      - title
      - total_minor
      - mode
      - already_paid
      - owner_share_minor
      - participants
